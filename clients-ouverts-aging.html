<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clients ouverts — Aging | Jobalto</title><style>
:root{--teal:#1f7a76;--gold:#c9a961;--ink:#1c2b2a;--bg:#f4f6f5;--card:#fff;--line:#e3e8e7}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px 80px}
header.hero{background:linear-gradient(135deg,#1f7a76,#155e5b);color:#fff;padding:24px 0 20px;position:relative}
.hero h1{font-size:23px;font-weight:700}.hero .sub{opacity:.85;font-size:13px;margin-top:4px}
.gear{position:absolute;top:18px;right:18px;background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:8px;padding:7px 11px;cursor:pointer;font-size:13px}
.reload{position:absolute;top:18px;right:96px;background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:8px;padding:7px 11px;cursor:pointer;font-size:13px}
.kpis{display:flex;gap:14px;margin-top:16px;flex-wrap:wrap}
.kpi{background:rgba(255,255,255,.12);border-radius:10px;padding:9px 15px}
.kpi b{font-size:19px;display:block}.kpi span{font-size:10.5px;opacity:.85;text-transform:uppercase;letter-spacing:.5px}
.kpi.litige{background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.35)}
.kpi.alerte{background:rgba(192,57,43,.35);border:1px solid rgba(255,255,255,.4)}
nav.sticky{position:sticky;top:0;z-index:20;background:#fffffff2;backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 0}
.chips{display:flex;gap:8px;flex-wrap:wrap;max-width:1120px;margin:0 auto;padding:0 16px;align-items:center}
.chip{display:flex;flex-direction:column;text-decoration:none;color:#fff;border-radius:9px;padding:7px 13px;min-width:118px;transition:transform .1s}
.chip:hover{transform:translateY(-2px)}
.chip .lab{font-size:11px;font-weight:600}.chip .amt{font-size:15px;font-weight:700}.chip .cnt{font-size:10px;opacity:.85}
section.bucket{margin-top:24px;scroll-margin-top:68px}
.bhead{display:flex;align-items:center;gap:12px;border-radius:12px 12px 0 0;padding:13px 18px;color:#fff}
.bhead h2{font-size:17px;font-weight:700}.bhead .meta{margin-left:auto;font-size:13px;font-weight:600;text-align:right}
.bbody{background:var(--card);border:1px solid var(--line);border-top:none;border-radius:0 0 12px 12px;overflow:hidden}
.crow{border-bottom:1px solid var(--line)}.crow:last-child{border-bottom:none}
.chead{display:flex;align-items:center;gap:10px;padding:11px 18px;cursor:pointer;user-select:none}
.chead:hover{background:#f8faf9}
.chead .nm{font-weight:600;font-size:14px}.chead .badge{font-size:10px;font-weight:700;color:#fff;border-radius:20px;padding:2px 9px}
.chead .tot{margin-left:auto;font-weight:700;font-size:14px}.chead .nf{font-size:11px;color:#789;margin-left:4px}
.arrow{transition:transform .15s;color:#9ab;font-size:12px}.crow.open .arrow{transform:rotate(90deg)}
.litbtn{margin-left:10px;font-size:11px;font-weight:600;background:#fff;color:#c0392b;border:1px solid #c0392b;border-radius:7px;padding:5px 10px;cursor:pointer;white-space:nowrap}
.litbtn:hover{background:#c0392b;color:#fff}.litbtn:disabled{opacity:.5;cursor:default}
.facs{display:none;background:#fbfcfc;padding:4px 18px 12px 40px}.crow.open .facs{display:block}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;color:#789;font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:6px 8px;border-bottom:1px solid #eef2f1}td.r,th.r{text-align:right}
.od{font-weight:700;border-radius:6px;padding:1px 7px;font-size:11px;color:#fff;white-space:nowrap}
.flag75{display:inline-block;font-size:9.5px;font-weight:700;color:#fff;background:#7b1f1f;border-radius:5px;padding:1px 6px;margin-left:6px}
.searchbar input{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:10px;font-size:14px;margin-top:16px}
.hidden{display:none!important}.done{opacity:.45}
.alertbox{background:#fff0f0;border:1px solid #c0392b;border-left:5px solid #c0392b;border-radius:10px;padding:14px 18px;margin-top:18px}
.alertbox h3{color:#c0392b;font-size:15px;margin-bottom:8px}
.alertbox table{font-size:12px}.alertbox td,.alertbox th{border-bottom:1px solid #f0d0d0}
.fnote{font-size:11px;color:#8a9794;margin-top:18px;text-align:center}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1c2b2a;color:#fff;padding:11px 18px;border-radius:9px;font-size:13px;opacity:0;transition:.2s;z-index:50;pointer-events:none}
#toast.show{opacity:1}#toast.err{background:#c0392b}
.modal{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center;z-index:60}
.modal.show{display:flex}
.modal .box{background:#fff;border-radius:12px;padding:26px;max-width:500px;width:90%}
.modal h3{color:var(--teal);font-size:19px;margin-bottom:10px}
.modal p{font-size:13.5px;margin-bottom:12px;line-height:1.5}
.modal input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:7px;font-family:monospace;font-size:13px;margin-bottom:12px}
.modal button{width:100%;padding:11px;background:var(--teal);color:#fff;border:0;border-radius:7px;font-size:14px;font-weight:600;cursor:pointer}
.center{max-width:560px;margin:50px auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:30px;text-align:center}
.spin{width:34px;height:34px;border:3px solid #d8e4e3;border-top-color:var(--teal);border-radius:50%;animation:s 1s linear infinite;margin:18px auto}
@keyframes s{to{transform:rotate(360deg)}}
</style></head><body>
<header class="hero"><div class="wrap">
<button class="reload" onclick="init()">↻ Recharger</button>
<button class="gear" onclick="setupPat()">⚙ Token</button>
<h1>Clients ouverts — Aging par échéance</h1>
<div class="sub">Jobalto SRL · lecture live Airtable (échéances réelles) · <span id="asof"></span></div>
<div class="kpis" id="kpis"></div></div></header>
<nav class="sticky" id="nav" style="display:none"><div class="chips" id="chips"></div></nav>
<div class="wrap"><div id="root"></div></div>
<div id="toast"></div>
<div class="modal" id="patmodal"><div class="box"><h3>Token Airtable</h3>
<p>Ce dashboard lit les factures directement depuis Airtable. Colle ton token personnel (PAT) — stocké uniquement dans ton navigateur (localStorage), jamais publié.</p>
<input type="password" id="patin" placeholder="patXXXX.YYYY..."><button onclick="savePat()">Enregistrer et charger</button></div></div>
<script>
const BASE='appglh7wfz1QDn8N9', TABLE='tblNjYi4xgnfegP8X';
const F={st:'fldS6LgkePwlntxQw',ech:'fldacyKruQey6d62T',tot:'fldTJ6Po9PCqbFL1n',cust:'fld1FYu4kPxixfPvE',fac:'fldmFKzo1UqNFIybR'};
const OPEN=['To be Paid','Late','Need Manual Check','Pending Bank Update','Instalment Plan','A Créditer'];
const LITIGE='Litige assurance';
const PKEY='clientsouverts.pat';
const COL={e90:'#c0392b',d61:'#e67e22',c31:'#e0a800',b0:'#3d8a86',ech:'#1f7a76'};
const BUCKETS=[
 {k:'e90',lab:'Échu >90j',f:od=>od>90,col:COL.e90,lit:true},
 {k:'d61',lab:'Échu 61-90j',f:od=>od>=61&&od<=90,col:COL.d61,lit:true},
 {k:'c31',lab:'Échu 31-60j',f:od=>od>=31&&od<=60,col:COL.c31,lit:false},
 {k:'b0',lab:'Échu 0-30j',f:od=>od>=0&&od<=30,col:COL.b0,lit:false},
 {k:'ech',lab:'À échoir',f:od=>od<0,col:COL.ech,lit:false},
];
function getPat(){return localStorage.getItem(PKEY)||''}
function savePat(){var v=document.getElementById('patin').value.trim();if(!/^pat[A-Za-z0-9]{10,}\..+/.test(v)){toast('Format token invalide',1);return}localStorage.setItem(PKEY,v);document.getElementById('patmodal').classList.remove('show');init()}
function setupPat(){document.getElementById('patin').value=getPat();document.getElementById('patmodal').classList.add('show')}
function toast(m,e){var t=document.getElementById('toast');t.textContent=m;t.className='show'+(e?' err':'');setTimeout(function(){t.className=e?'err':''},2800)}
function eur(x){return new Intl.NumberFormat('fr-BE',{maximumFractionDigits:0}).format(x)+' €'}
function eur2(x){return new Intl.NumberFormat('fr-BE',{minimumFractionDigits:2,maximumFractionDigits:2}).format(x)+' €'}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function chunk(a,n){var o=[];for(var i=0;i<a.length;i+=n)o.push(a.slice(i,i+n));return o}
function daysOverdue(ech){if(!ech)return null;var t=new Date();t.setHours(0,0,0,0);var d=new Date(ech+'T00:00:00');return Math.floor((t-d)/86400000)}

async function atFetch(url,opts){var pat=getPat();if(!pat)throw new Error('NO_PAT');
 var headers=Object.assign({'Authorization':'Bearer '+pat,'Content-Type':'application/json'},opts&&opts.headers||{});
 var res=await fetch(url,Object.assign({},opts,{headers}));
 if(res.status===401||res.status===403)throw new Error('BAD_PAT');
 if(!res.ok){var e='Airtable '+res.status;try{var j=await res.json();e+=' — '+(j.error&&j.error.message||'')}catch(_){}throw new Error(e)}
 return await res.json()}

async function fetchOpen(){
 var statuses=OPEN.concat([LITIGE]);
 var formula='OR('+statuses.map(function(s){return "{Invoice Status}='"+s+"'"}).join(',')+')';
 var base='https://api.airtable.com/v0/'+BASE+'/'+TABLE;
 var all=[],offset=null;
 do{
  var p=new URLSearchParams({pageSize:'100',returnFieldsByFieldId:'true',filterByFormula:formula});
  [F.st,F.ech,F.tot,F.cust,F.fac].forEach(function(f){p.append('fields[]',f)});
  if(offset)p.set('offset',offset);
  var d=await atFetch(base+'?'+p.toString());
  all=all.concat(d.records||[]);offset=d.offset||null;
 }while(offset);
 return all.map(function(r){var c=r.fields;var stv=c[F.st];return{id:r.id,st:(stv&&stv.name)||stv||'',cust:(c[F.cust]||'?').replace(/_/g,' ').trim(),fac:c[F.fac]||'',tot:c[F.tot]||0,ech:c[F.ech]||null}});
}

function build(inv){
 var litige=inv.filter(function(i){return i.st===LITIGE});
 var act=inv.filter(function(i){return i.st!==LITIGE});
 var openIds={};inv.forEach(function(i){(openIds[i.cust]=openIds[i.cust]||[]).push(i.id)});
 var bkable=act.filter(function(i){return i.ech&&i.tot>0}).map(function(i){return Object.assign({od:daysOverdue(i.ech)},i)});
 var other=act.filter(function(i){return !(i.ech&&i.tot>0)});
 var buckets=BUCKETS.map(function(b){
   var items=bkable.filter(function(i){return b.f(i.od)});
   var byc={};items.forEach(function(i){(byc[i.cust]=byc[i.cust]||[]).push(i)});
   var clients=Object.keys(byc).map(function(c){var fs=byc[c].slice().sort(function(a,b){return b.od-a.od});
     return{client:c,total:fs.reduce(function(s,f){return s+f.tot},0),n:fs.length,maxod:Math.max.apply(0,fs.map(function(f){return f.od})),openIds:openIds[c]||[],facs:fs}});
   clients.sort(function(a,b){return b.total-a.total});
   return{k:b.k,lab:b.lab,col:b.col,lit:b.lit,clients:clients,total:clients.reduce(function(s,c){return s+c.total},0),nfac:items.length,nclient:clients.length}});
 var over75=bkable.filter(function(i){return i.od>75}).sort(function(a,b){return b.od-a.od});
 return{buckets:buckets,litige:{total:litige.reduce(function(s,i){return s+i.tot},0),n:litige.length},
   grand:bkable.reduce(function(s,i){return s+i.tot},0),echu:bkable.filter(function(i){return i.od>0}).reduce(function(s,i){return s+i.tot},0),
   over75:over75,otherN:other.length,otherTot:other.reduce(function(s,i){return s+i.tot},0)}}

function odBg(o){return o>90?'#c0392b':o>60?'#e67e22':o>30?'#e0a800':o>=0?'#3d8a86':'#1f7a76'}

function render(D){
 document.getElementById('asof').textContent='arrêté au '+new Date().toLocaleDateString('fr-BE');
 var k=document.getElementById('kpis');
 k.innerHTML='<div class="kpi"><b>'+eur(D.grand)+'</b><span>Encours actif</span></div>'
  +'<div class="kpi"><b>'+eur(D.echu)+'</b><span>Échu</span></div>'
  +'<div class="kpi alerte"><b>'+eur(D.over75.reduce(function(s,i){return s+i.tot},0))+'</b><span>&gt;75j → litige Alex ('+D.over75.length+')</span></div>'
  +'<div class="kpi litige"><b>'+eur(D.litige.total)+'</b><span>Litige assurance ('+D.litige.n+')</span></div>';
 var chips=document.getElementById('chips');chips.innerHTML='';
 D.buckets.forEach(function(b){chips.innerHTML+='<a class="chip" style="background:'+b.col+'" href="#sec_'+b.k+'"><span class="lab">'+b.lab+'</span><span class="amt">'+eur(b.total)+'</span><span class="cnt">'+b.nclient+' cl · '+b.nfac+' f</span></a>'});
 document.getElementById('nav').style.display='';
 var root=document.getElementById('root');
 var h='<div class="searchbar"><input id="q" placeholder="🔎 Filtrer un client…" oninput="filt()"></div>';
 if(D.over75.length){h+='<div class="alertbox"><h3>⚠️ '+D.over75.length+' factures &gt; 75 jours de retard — à remettre en litige assurance (Alex)</h3><table><tr><th>Client</th><th>Facture</th><th class="r">Montant</th><th class="r">Retard</th></tr>';
  D.over75.forEach(function(f){h+='<tr><td>'+esc(f.cust)+'</td><td>'+esc(f.fac)+'</td><td class="r">'+eur2(f.tot)+'</td><td class="r" style="color:#c0392b;font-weight:700">+'+f.od+'j</td></tr>'});
  h+='</table></div>'}
 D.buckets.forEach(function(b){
  h+='<section class="bucket" id="sec_'+b.k+'"><div class="bhead" style="background:'+b.col+'"><h2>'+b.lab+'</h2><div class="meta">'+eur2(b.total)+'<br><span style="font-weight:400;font-size:11px;opacity:.9">'+b.nclient+' clients · '+b.nfac+' factures</span></div></div><div class="bbody">';
  b.clients.forEach(function(c){var od=c.maxod;var odl=od>0?(od+'j retard'):('échoit dans '+(-od)+'j');
   var litbtn=b.lit?'<button class="litbtn" data-ids="'+c.openIds.join(',')+'" data-name="'+esc(c.client)+'" onclick="toLitige(this,event)">→ Litige assurance</button>':'';
   h+='<div class="crow" data-name="'+esc(c.client.toLowerCase())+'"><div class="chead" onclick="tog(this)"><span class="arrow">▶</span><span class="nm">'+esc(c.client)+'</span><span class="badge" style="background:'+b.col+'">'+odl+'</span>'+litbtn+'<span class="tot">'+eur2(c.total)+'</span><span class="nf">· '+c.n+'f</span></div><div class="facs"><table><tr><th>Facture</th><th>Échéance</th><th class="r">Montant TVAC</th><th class="r">Retard</th><th>Statut</th></tr>';
   c.facs.forEach(function(f){h+='<tr><td>'+esc(f.fac)+'</td><td>'+f.ech+'</td><td class="r">'+eur2(f.tot)+'</td><td class="r"><span class="od" style="background:'+odBg(f.od)+'">'+(f.od>0?'+':'')+f.od+'j</span>'+(f.od>75?'<span class="flag75">LITIGE</span>':'')+'</td><td>'+esc(f.st)+'</td></tr>'});
   h+='</table></div></div>'});
  h+='</div></section>'});
 h+='<div class="fnote">Lecture live Airtable (statuts ouverts : To be Paid, Late, Need Manual Check, Pending Bank Update, Instalment Plan, A Créditer). Hors buckets : '+D.litige.n+' factures Litige assurance (KPI) et '+D.otherN+' notes de crédit / sans échéance ('+eur2(D.otherTot)+'). Aging sur Date Echeance.</div>';
 root.innerHTML=h;
}
function tog(el){el.parentNode.classList.toggle('open')}
function filt(){var q=document.getElementById('q').value.toLowerCase().trim();document.querySelectorAll('.crow').forEach(function(r){var hit=!q||r.dataset.name.indexOf(q)>-1;r.classList.toggle('hidden',!hit);if(q&&hit)r.classList.add('open')})}
async function toLitige(btn,ev){ev.stopPropagation();
 var ids=btn.dataset.ids.split(',').filter(Boolean),name=btn.dataset.name;
 if(!getPat()){setupPat();return}
 if(!confirm('Passer TOUTES les factures ouvertes de '+name+' ('+ids.length+') en Litige assurance ?'))return;
 btn.disabled=true;btn.textContent='…';
 var url='https://api.airtable.com/v0/'+BASE+'/'+TABLE;
 try{for(var gi=0,grps=chunk(ids,10);gi<grps.length;gi++){var grp=grps[gi];
   var body={typecast:true,records:grp.map(function(id){var f={};f[F.st]=LITIGE;return{id:id,fields:f}})};
   await atFetch(url,{method:'PATCH',body:JSON.stringify(body)});}
  toast(name+' → Litige assurance ('+ids.length+' factures)');init();
 }catch(e){btn.disabled=false;btn.textContent='→ Litige assurance';toast('Erreur: '+e.message,1)}}

async function init(){
 var root=document.getElementById('root');
 if(!getPat()){document.getElementById('nav').style.display='none';root.innerHTML='<div class="center"><h2 style="color:var(--teal)">Token requis</h2><p style="margin:12px 0">Ce dashboard lit les factures en direct depuis Airtable.</p><button onclick="setupPat()" style="padding:11px 18px;background:var(--teal);color:#fff;border:0;border-radius:8px;font-weight:600;cursor:pointer">Saisir le token</button></div>';return}
 root.innerHTML='<div class="center"><div class="spin"></div><p>Chargement des factures…</p></div>';
 try{var inv=await fetchOpen();render(build(inv));}
 catch(e){if(e.message==='BAD_PAT'){localStorage.removeItem(PKEY);root.innerHTML='<div class="center"><h2 style="color:#c0392b">Token rejeté</h2><p>401/403 — vérifie le token.</p><button onclick="setupPat()" style="padding:10px 16px;background:var(--teal);color:#fff;border:0;border-radius:8px;cursor:pointer">Ressaisir</button></div>'}
  else root.innerHTML='<div class="center"><h2 style="color:#c0392b">Erreur</h2><p>'+esc(e.message)+'</p></div>'}}
init();
</script></body></html>
